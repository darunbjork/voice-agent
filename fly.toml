# fly.toml — API on Fly.io
app = "voice-agent-api"
primary_region = "arn"

[build]
  dockerfile = "packages/api/Dockerfile"

[deploy]
  release_command = "pnpm --filter @voice-agent/api exec prisma migrate deploy"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3001"
  VOICE_MOCK = "true"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"