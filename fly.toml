# fly.toml — API on Fly.io
app = "darun-voice-agent-api"
primary_region = "arn"

[build]
  dockerfile = "packages/api/Dockerfile"

[deploy]
  release_command = "pnpm --filter @voice-agent/api exec prisma migrate deploy"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3001"
  VOICE_MOCK = "false"
  # Daily LLM token cap (Gemini + Groq, one shared counter). Both keys are on
  # free tiers with no billing, so this guards the free quotas against abuse;
  # it is not a cost limit. The code default (50000) ran out after ~45 live
  # questions in one day. See docs/cost.md.
  DAILY_MAX_TOKENS = "300000"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"