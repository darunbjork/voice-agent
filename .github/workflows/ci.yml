name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - run: pnpm turbo lint
  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voice-agent/api exec prisma generate
      - run: pnpm turbo type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [type-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voiceagent
          POSTGRES_PASSWORD: voiceagent
          POSTGRES_DB: voiceagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voiceagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      NODE_ENV: test
      VOICE_MOCK: "true"
      DATABASE_URL: postgresql://voiceagent:voiceagent@localhost:5432/voiceagent
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_secret_that_is_at_least_32_characters_long
      PORT: "3001"
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voice-agent/api exec prisma generate
      - run: pnpm --filter @voice-agent/api exec prisma migrate deploy
      - run: pnpm turbo test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voice-agent/api exec prisma generate
      - run: pnpm turbo build
